[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/worker",
    "crates/panta-client",
    "crates/solana-tx",
    "crates/basket-engine",
    "crates/domain",
    "crates/db",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
# internal crates
domain = { path = "crates/domain" }
db = { path = "crates/db" }
panta-client = { path = "crates/panta-client" }
solana-tx = { path = "crates/solana-tx" }
basket-engine = { path = "crates/basket-engine" }

# async runtime / web
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
futures = "0.3"

# data
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "uuid",
    "migrate",
] }

# http client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }

# solana
solana-sdk = "2.2"
solana-client = { version = "2.2", features = ["rustls"] }

# ser/de
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4", "serde"] }
ts-rs = { version = "10", features = ["chrono-impl", "serde-json-impl"] }

# errors / utils
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
jsonwebtoken = "9"
ed25519-dalek = { version = "2", features = ["rand_core"] }
bs58 = "0.5"
base64 = "0.22"
