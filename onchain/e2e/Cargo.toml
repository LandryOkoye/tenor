# End-to-end check of basket_vault against a local validator that clones
# Panta's mainnet program + two live markets (see onchain/e2e/run.sh).
[package]
name = "vault_e2e"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
solana-sdk = "2.2"
solana-client = "2.2"
serde_json = "1"
base64 = "0.22"
openssl = { version = "0.10", features = ["vendored"] }

[workspace]
