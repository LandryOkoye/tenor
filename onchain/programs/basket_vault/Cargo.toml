[package]
name = "basket_vault"
version = "0.1.0"
description = "Tokenized baskets: a vault that holds Panta positions and mints a basket token"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "basket_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.1"
anchor-spl = { version = "1.1", features = ["token", "associated_token"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug"))'] }
